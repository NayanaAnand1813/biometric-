<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Verified - Welcome {{ profile.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2310b981%22 stroke-width=%222%22><path d=%22M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z%22/><polyline points=%229 12 11 14 15 10%22/></svg>">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
    }
    .welcome-container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }
    .welcome-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px rgba(16, 185, 129, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .welcome-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #10b981, #38bdf8, transparent);
    }
    .shield-badge-box {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10b981;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #34d399;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.35);
      animation: shieldPulse 3s ease-in-out infinite alternate;
    }
    @keyframes shieldPulse {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(16, 185, 129, 0.25); }
      100% { transform: scale(1.04); box-shadow: 0 0 35px rgba(16, 185, 129, 0.5); }
    }
    .profile-card {
      background: rgba(11, 18, 33, 0.7);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin: 28px 0;
      text-align: left;
    }
    .profile-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .profile-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .profile-label {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .profile-label svg {
      width: 16px;
      height: 16px;
      color: var(--text-dim);
    }
    .profile-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      font-family: var(--font-body);
    }
  </style>
</head>
<body>

  <div class="welcome-container">
    <div class="welcome-card">
      <!-- Clearance Shield -->
      <div class="shield-badge-box">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>

      <!-- Welcome Heading -->
      <div class="badge badge-success" style="margin-bottom: 14px;">
        <span class="pulse-dot" style="width: 6px; height: 6px;" aria-hidden="true"></span>
        <span>Clearance Granted • Tier 1 Verified</span>
      </div>

      <h1 style="font-size: 2.3rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px;">
        Welcome, {{ profile.name }}
      </h1>
      <p style="color: #34d399; font-size: 1rem; font-weight: 500;">
        Facial Biometric Match Confirmed via LBPH Local Patterns
      </p>

      <!-- Profile Credentials Card -->
      <div class="profile-card">
        <div class="profile-row">
          <span class="profile-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Full Name:</span>
          </span>
          <span class="profile-value">{{ profile.name }}</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            <span>Assigned Role:</span>
          </span>
          <span class="profile-value" style="color: #38bdf8;">{{ profile.position }}</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>Email Address:</span>
          </span>
          <span class="profile-value">{{ profile.email }}</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>Auth Pipeline:</span>
          </span>
          <span class="badge badge-info">OpenCV LBPH 80-NN</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; gap: 14px;">
        <a href="{{ url_for('landing_page') }}?msg=logged_out" class="btn btn-secondary" style="flex: 1; padding: 14px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>End Session & Logout</span>
        </a>

        <a href="{{ url_for('login_page') }}" class="btn btn-primary" style="flex: 1; padding: 14px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          <span>Authenticate Again</span>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
